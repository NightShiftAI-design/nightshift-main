<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard — NightShift AI</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/dashboard/config.js"></script>
<style>
  body { background: #05070d; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: -apple-system, sans-serif; color: #eef2ff; }
  .loader { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .loader img { width: 40px; height: 40px; border-radius: 10px; }
  .loader p { font-size: 13px; color: rgba(238,242,255,.4); }
  .spin { width: 20px; height: 20px; border: 2px solid rgba(79,140,255,.2); border-top-color: #4f8cff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader">
  <img src="/favicon-32x32.png" alt="NightShift AI">
  <div class="spin"></div>
  <p>Loading your workspace...</p>
</div>
<script>
const FOUNDER_EMAIL = 'founder@nightshifthotels.com';
const sb = supabase.createClient(window.NSA_CONFIG.SUPABASE_URL, window.NSA_CONFIG.SUPABASE_ANON_KEY);

async function route() {
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    // Check for property param (from magic link redirect)
    const params = new URLSearchParams(window.location.search);
    const property = params.get('property');
    if (property) {
      window.location.href = '/dashboard/client.html?property=' + property;
      return;
    }
    // No session — send to client login (handles both founder and client auth)
    window.location.href = '/dashboard/client.html';
    return;
  }

  if (session.user.email === FOUNDER_EMAIL) {
    window.location.href = '/dashboard/founder.html';
  } else {
    window.location.href = '/dashboard/client.html';
  }
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN') route();
});

route();
</script>
</body>
</html>
